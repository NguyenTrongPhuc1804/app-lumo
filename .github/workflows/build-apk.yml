name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_SERVER_URL: ${{ vars.EXPO_PUBLIC_SERVER_URL }}
      EXPO_PUBLIC_APP_KEY: ${{ secrets.EXPO_PUBLIC_APP_KEY }}
      EXPO_PUBLIC_ADMIN_KEY: ''

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Run tests and type check
        run: |
          npm test
          npx tsc --noEmit

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --npm

      # shortcut: Expo's bundled debug key is for testing only; replace with private signing before publishing.
      - name: Check test signing configuration
        run: |
          test -f android/app/debug.keystore
          node -e "const fs = require('node:fs'); const gradle = fs.readFileSync('android/app/build.gradle', 'utf8'); if (!/release\s*\{[\s\S]*?signingConfig signingConfigs\.debug/.test(gradle)) throw new Error('Expected release APK signed with Expo test key');"

      - name: Build standalone release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lumo-lens-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
